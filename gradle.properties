org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Backend endpoints. Override per machine in local.properties (same keys) when needed.
omni.apiBaseUrl=https://runtimes.laxmi.solutions/api/
omni.authBaseUrl=https://runtimes.laxmi.solutions/authapi/
omni.jwtAudience=ls-judge-android
# Google Cloud project linked to the app in Play Console (App integrity); a public number, not a secret.
# Required for release builds; 0 turns Play Integrity off (debug builds are never Play-recognised anyway).
omni.playIntegrity.cloudProjectNumber=753658365470
# Play in-app update priority (0-5, set per release) at or above which the update is required before use.
omni.update.immediatePriority=4
omni.legalBaseUrl=https://legal.laxmi.solutions/ls-judge/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
